<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4fb3d9">
<title>Mysön</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-screen canvas with floating pill HUD; title card floats over a live island. */
:root {
  --sea: #4fb3d9;
  --ink: #2b2646;
  --ink-glass: rgba(43, 38, 70, 0.78);
  --cream: #fffaf0;
  --sun: #ffd23f;
  --berry: #ff6fa8;
  --leaf: #5cbf52;
  --font-display: "Fredoka", "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sea); color: var(--ink); }
body {
  font-family: var(--font-body);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  padding-left: max(16px, var(--safe-l));
  padding-right: max(16px, var(--safe-r));
}
[hidden] { display: none !important; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* ---------- HUD ---------- */
.hud-top {
  position: fixed; top: 0; left: 0; right: 0;
  padding: calc(10px + var(--safe-t)) max(12px, var(--safe-r)) 0 max(12px, var(--safe-l));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  pointer-events: none;
}
.hud-top > * { pointer-events: auto; }
.pill {
  background: var(--ink-glass); color: #fff; border-radius: 999px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 3px 0 rgba(0,0,0,0.18);
}
.island-name {
  font-family: var(--font-display); font-weight: 600; font-size: 18px;
  padding: 8px 16px; letter-spacing: 0.01em; max-width: 50vw;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hud-buttons { display: flex; gap: 8px; }
.round {
  width: 52px; height: 52px; border-radius: 50%; font-size: 24px;
  display: grid; place-items: center;
}
.round:active { transform: scale(0.92); }

.hud-bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 max(12px, var(--safe-r)) calc(12px + var(--safe-b)) max(12px, var(--safe-l));
  display: flex; justify-content: center; pointer-events: none;
}
.inventory { display: flex; gap: 4px; padding: 6px 8px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
.slot {
  display: flex; align-items: center; gap: 4px; padding: 4px 10px 4px 6px; border-radius: 999px;
  font-family: var(--font-display); font-weight: 700; font-size: 20px; color: #fff;
  font-variant-numeric: tabular-nums; min-width: 58px;
}
.slot .ic { font-size: 26px; line-height: 1; }
.slot.bump { animation: bump 0.35s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); background: rgba(255,210,63,0.35); } 100% { transform: scale(1); } }

.zoom { position: fixed; right: max(12px, var(--safe-r)); bottom: calc(86px + var(--safe-b)); display: flex; flex-direction: column; gap: 8px; }
.zoom .round { width: 44px; height: 44px; font-size: 22px; font-family: var(--font-display); font-weight: 700; }

.hint {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + var(--safe-b));
  font-family: var(--font-display); font-weight: 500; font-size: 17px;
  padding: 10px 18px; text-align: center; max-width: calc(100vw - 120px);
  pointer-events: none;
}
.toast {
  position: fixed; left: 50%; top: calc(74px + var(--safe-t)); transform: translateX(-50%);
  font-family: var(--font-display); font-weight: 600; font-size: 18px; padding: 10px 18px;
  pointer-events: none; transition: opacity 0.3s; white-space: nowrap;
}

/* ---------- Title ---------- */
.title {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: calc(16px + var(--safe-t)) max(16px, var(--safe-r)) calc(16px + var(--safe-b)) max(16px, var(--safe-l));
  background: linear-gradient(180deg, rgba(79,179,217,0.25), rgba(43,38,70,0.35));
  overflow-y: auto;
}
.card {
  width: min(460px, 100%); background: var(--cream); border-radius: 28px;
  padding: 22px 22px 20px; box-shadow: 0 8px 0 rgba(43,38,70,0.25), 0 20px 50px rgba(43,38,70,0.25);
  display: flex; flex-direction: column; gap: 16px;
}
.logo {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 12vw, 64px);
  line-height: 0.95; margin: 0; text-align: center; color: var(--ink); letter-spacing: -0.01em;
}
.logo span { color: var(--berry); }
.tag { text-align: center; margin: -8px 0 0; font-weight: 600; color: #5c5578; }
.label {
  font-family: var(--font-display); font-weight: 600; font-size: 14px; text-transform: uppercase;
  letter-spacing: 0.08em; color: #6d6690; margin: 0 0 6px;
}
.avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.avatar {
  font-size: 34px; aspect-ratio: 1; border-radius: 18px; background: #f1ebdc;
  display: grid; place-items: center; max-width: 100%;
}
.avatar[aria-pressed="true"] { background: var(--sun); box-shadow: inset 0 0 0 3px var(--ink); }
.name-input {
  width: 100%; box-sizing: border-box; font: 600 20px var(--font-display); color: var(--ink);
  padding: 12px 16px; border-radius: 16px; border: 0; background: #f1ebdc;
}
.worlds { display: flex; flex-direction: column; gap: 8px; }
.world {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px;
  background: #e5f4fa; text-align: left; font-family: var(--font-display); font-weight: 600; font-size: 19px;
}
.world .when { margin-left: auto; font-family: var(--font-body); font-size: 13px; font-weight: 600; color: #5c5578; }
.world .del { background: transparent; font-size: 18px; padding: 4px 6px; border-radius: 10px; }
.world.confirm { background: #ffe1ec; }
.big {
  font-family: var(--font-display); font-weight: 700; font-size: 24px; padding: 16px; border-radius: 20px;
  background: var(--leaf); color: #fff; box-shadow: 0 5px 0 #3f8f38;
}
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #3f8f38; }
.small-note { font-size: 13px; color: #6d6690; text-align: center; margin: 0; }

@media (max-width: 480px) {
  .inventory { flex-wrap: nowrap; gap: 0; padding: 4px; }
  .slot { font-size: 16px; padding: 3px 6px 3px 4px; min-width: 0; gap: 2px; }
  .slot .ic { font-size: 21px; }
  .hint { font-size: 15px; bottom: calc(70px + var(--safe-b)); }
  .zoom { bottom: calc(120px + var(--safe-b)); }
}
@media (prefers-reduced-motion: reduce) { .slot.bump { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-top">
    <div class="pill island-name" id="islandName">Mysön</div>
    <div class="hud-buttons">
      <button class="pill round" id="muteBtn" aria-label="Ljud av/på">🔊</button>
      <button class="pill round" id="homeBtn" aria-label="Till start">🏠</button>
    </div>
  </div>
  <div class="zoom">
    <button class="pill round" id="zoomIn" aria-label="Zooma in">+</button>
    <button class="pill round" id="zoomOut" aria-label="Zooma ut">−</button>
  </div>
  <div class="pill hint" id="hint">Tryck på ett träd för att hugga trä 🪵</div>
  <div class="pill toast" id="toast" style="opacity:0"></div>
  <div class="hud-bottom"><div class="pill inventory" id="inventory"></div></div>
</div>

<div class="title" id="title">
  <div class="card">
    <h1 class="logo">Mys<span>ön</span></h1>
    <p class="tag">Samla, bygg och bo på din egen ö</p>
    <div>
      <p class="label">Vem är du?</p>
      <div class="avatars" id="avatars"></div>
    </div>
    <div>
      <p class="label"><label for="playerName">Ditt namn</label></p>
      <input class="name-input" id="playerName" maxlength="14" placeholder="Skriv ditt namn" autocomplete="off">
    </div>
    <div id="worldsWrap">
      <p class="label">Dina öar</p>
      <div class="worlds" id="worlds"></div>
    </div>
    <button class="big" id="newWorld">Ny ö 🏝️</button>
    <p class="small-note">Ön sparas i den här webbläsaren.</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
